name: rimg
description: Fast image compression (mozjpeg / WebP / AVIF + SIMD resize) backed by Rust via Dart native assets.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.1.0
  hooks: ">=2.0.2 <2.1.0"
  native_toolchain_rust: ">=1.0.4 <1.0.5"  # newer needs meta 1.19, Flutter 3.44 pins 1.18

dev_dependencies:
  image: ^4.13.0
  test: any
