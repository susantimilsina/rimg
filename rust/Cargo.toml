[package]
name = "rimg"
version = "0.1.0"
edition = "2024"

[dependencies]
fast_image_resize = { version = "6.1.0", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
imgref = { version = "1.12.3", optional = true }
mozjpeg = "0.10.13"
qcms = "0.3.0"
ravif = { version = "0.13.0", optional = true }
rgb = "0.8.53"
webp = "0.3.1"

[features]
default = ["avif"]
# AVIF encoding (rav1e) adds most of the binary size; disable to save ~MBs.
avif = ["dep:ravif", "dep:imgref"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
opt-level = 3

[target.'cfg(target_os = "android")'.dependencies]
libloading = "0.8"

[dev-dependencies]
ssimulacra2 = "0.5.1"
